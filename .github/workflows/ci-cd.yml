name: ci-cd
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify GA-only NuGet packages (Constitution III)
        run: |
          if grep -RInE 'Version="[^"]*-(preview|rc|alpha|beta)' backend/**/*.csproj; then
            echo "::error::Preview/non-GA NuGet packages detected (Constitution III)"
            exit 1
          fi

      - name: Restore + build backend
        run: |
          dotnet restore backend/fraud-ai-demo.slnx
          dotnet build backend/fraud-ai-demo.slnx --no-restore --configuration Release

      - name: Test backend
        run: dotnet test backend/fraud-ai-demo.slnx --no-build --configuration Release --verbosity minimal

      - name: Install + test frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test -- --run

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/setup-azd@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: azd deploy
        env:
          AZURE_ENV_NAME: ${{ secrets.AZURE_ENV_NAME }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: azd deploy --no-prompt
